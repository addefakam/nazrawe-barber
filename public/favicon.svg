<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Dark Glassmorphic/Metallic Background -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  
  <!-- Subtle Glowing Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGradient)" stroke-width="8" opacity="0.15" />
  
  <!-- Decorative Barber Stripes inside Ring (subtle) -->
  <path d="M120 16 L16 120 M220 16 L16 220 M320 16 L16 320 M420 16 L16 420 M496 96 L96 496 M496 196 L196 496 M496 296 L296 496 M496 396 L396 496" stroke="url(#goldGradient)" stroke-width="4" opacity="0.05" stroke-linecap="round" />

  <!-- Gorgeous Vector Barber Scissors -->
  <g transform="translate(256, 256) scale(1.4) translate(-100, -100)">
    <!-- Shadow for depth -->
    <path d="M 50 150 C 30 150 10 130 10 110 C 10 95 20 80 40 75 L 90 90 L 150 30 L 160 40 L 105 100 L 150 160 C 170 170 190 150 190 130" fill="none" stroke="#000000" stroke-width="20" opacity="0.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Handle Ring -->
    <circle cx="50" cy="150" r="30" fill="none" stroke="url(#goldGradient)" stroke-width="16" />
    <circle cx="50" cy="150" r="10" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.5" />
    <path d="M 75 135 L 105 105" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round" />

    <!-- Right Handle Ring -->
    <circle cx="150" cy="150" r="30" fill="none" stroke="url(#goldGradient)" stroke-width="16" />
    <circle cx="150" cy="150" r="10" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.5" />
    <path d="M 125 135 L 95 105" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round" />

    <!-- Center Pivot Screw -->
    <circle cx="100" cy="100" r="12" fill="url(#pivotGradient)" />
    <circle cx="100" cy="100" r="6" fill="#020617" />
    <line x1="96" y1="100" x2="104" y2="100" stroke="url(#goldGradient)" stroke-width="2" />

    <!-- Left Blade (going up-right) -->
    <path d="M 95 95 L 170 10 C 173 5 178 5 180 10 L 105 105 Z" fill="url(#bladeGradient)" stroke="url(#goldGradient)" stroke-width="2" />
    
    <!-- Right Blade (going up-left) -->
    <path d="M 105 95 L 30 10 C 27 5 22 5 20 10 L 95 105 Z" fill="url(#bladeGradient)" stroke="url(#goldGradient)" stroke-width="2" />
  </g>

  <!-- Gradients -->
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    
    <!-- Blade Metallic Gradient -->
    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Pivot Screw Metallic Gradient -->
    <linearGradient id="pivotGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
</svg>